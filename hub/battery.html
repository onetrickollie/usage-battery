<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage Battery</title>
<style>
  :root { --bg:#10101c; --card:#181828; --ink:#ececE4; --muted:#7a7a92; --empty:#2c2c40;
          --ok:#3ee07a; --low:#ffd23f; --critical:#ff4d4d; --shadow:#05050a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 48px; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
           flex-wrap:wrap; margin-bottom:28px; padding-bottom:14px;
           border-bottom:4px dotted var(--empty); }
  section { background:var(--card); border:4px solid var(--ink); box-shadow:8px 8px 0 var(--shadow);
            padding:20px 20px 8px; margin-bottom:28px; }
  .lines { display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin:10px 0 4px; }
  .meter { margin:18px 0 16px; }
  .top { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:10px; }
  .pct { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .battery { display:flex; align-items:center; }
  .shell { flex:1; display:grid; grid-template-columns:repeat(10, 1fr); gap:4px;
           border:4px solid var(--ink); padding:4px; }
  .block { height:22px; background:var(--empty); }
  .tip { width:8px; height:16px; background:var(--ink); }
  .reset { margin-top:10px; }
  #banner { display:none; background:var(--low); padding:12px; margin-bottom:24px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <header><div id="title"></div><div id="updated"></div></header>
  <div id="banner"></div>
  <div id="services"></div>
</main>
<script>
// 5x7 pixel font shared by all displays (see displays/README.md).
const GLYPHS = {
  A:"01110 10001 10001 11111 10001 10001 10001", B:"11110 10001 10001 11110 10001 10001 11110",
  C:"01110 10001 10000 10000 10000 10001 01110", D:"11110 10001 10001 10001 10001 10001 11110",
  E:"11111 10000 10000 11110 10000 10000 11111", F:"11111 10000 10000 11110 10000 10000 10000",
  G:"01110 10001 10000 10111 10001 10001 01111", H:"10001 10001 10001 11111 10001 10001 10001",
  I:"01110 00100 00100 00100 00100 00100 01110", J:"00111 00010 00010 00010 00010 10010 01100",
  K:"10001 10010 10100 11000 10100 10010 10001", L:"10000 10000 10000 10000 10000 10000 11111",
  M:"10001 11011 10101 10101 10001 10001 10001", N:"10001 10001 11001 10101 10011 10001 10001",
  O:"01110 10001 10001 10001 10001 10001 01110", P:"11110 10001 10001 11110 10000 10000 10000",
  Q:"01110 10001 10001 10001 10101 10010 01101", R:"11110 10001 10001 11110 10100 10010 10001",
  S:"01111 10000 10000 01110 00001 00001 11110", T:"11111 00100 00100 00100 00100 00100 00100",
  U:"10001 10001 10001 10001 10001 10001 01110", V:"10001 10001 10001 10001 10001 01010 00100",
  W:"10001 10001 10001 10101 10101 10101 01010", X:"10001 10001 01010 00100 01010 10001 10001",
  Y:"10001 10001 01010 00100 00100 00100 00100", Z:"11111 00001 00010 00100 01000 10000 11111",
  "0":"01110 10001 10011 10101 11001 10001 01110", "1":"00100 01100 00100 00100 00100 00100 01110",
  "2":"01110 10001 00001 00010 00100 01000 11111", "3":"11111 00010 00100 00010 00001 10001 01110",
  "4":"00010 00110 01010 10010 11111 00010 00010", "5":"11111 10000 11110 00001 00001 10001 01110",
  "6":"00110 01000 10000 11110 10001 10001 01110", "7":"11111 00001 00010 00100 01000 01000 01000",
  "8":"01110 10001 10001 01110 10001 10001 01110", "9":"01110 10001 10001 01111 00001 00010 01100",
  "%":"11000 11001 00010 00100 01000 10011 00011", ":":"00000 01100 01100 00000 01100 01100 00000",
  "/":"00000 00001 00010 00100 01000 10000 00000", ".":"00000 00000 00000 00000 00000 01100 01100",
  "-":"00000 00000 00000 11111 00000 00000 00000", "(":"00010 00100 01000 01000 01000 00100 00010",
  ")":"01000 00100 00010 00010 00010 00100 01000", " ":"00000 00000 00000 00000 00000 00000 00000",
  "!":"00100 00100 00100 00100 00100 00000 00100", "?":"01110 10001 00001 00010 00100 00000 00100",
  "'":"00100 00100 01000 00000 00000 00000 00000", ",":"00000 00000 00000 00000 01100 00100 01000",
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function pixelText(str, scale, color) {
  const s = String(str).toUpperCase();
  const c = document.createElement('canvas');
  c.width = Math.max(1, (s.length * 6 - 1) * scale);
  c.height = 7 * scale;
  c.setAttribute('role', 'img');
  c.setAttribute('aria-label', str);
  const g = c.getContext('2d');
  g.fillStyle = css(color);
  [...s].forEach((ch, i) => {
    (GLYPHS[ch] || GLYPHS['?']).split(' ').forEach((row, r) => {
      [...row].forEach((bit, col) => {
        if (bit === '1') g.fillRect((i * 6 + col) * scale, r * scale, scale, scale);
      });
    });
  });
  return c;
}

// Largest scale (down to 1) at which the text fits in `width` pixels.
function fitText(str, scale, color, width) {
  while (scale > 1 && (String(str).length * 6 - 1) * scale > width) scale--;
  return pixelText(str, scale, color);
}

// Long text (notes, errors) wraps into several pixel lines.
function pixelLines(str, scale, color, width) {
  const max = Math.max(8, Math.floor((width + scale) / (6 * scale)));
  const box = document.createElement('div');
  box.className = 'lines';
  let line = '';
  for (const word of String(str).split(/\s+/)) {
    if (line && (line + ' ' + word).length > max) { box.append(pixelText(line, scale, color)); line = ''; }
    line = line ? line + ' ' + word : word;
  }
  if (line) box.append(pixelText(line, scale, color));
  return box;
}

const level = left => left > 50 ? '--ok' : left > 20 ? '--low' : '--critical';

function shortLabel(label) {
  const l = label.toLowerCase();
  if (l.startsWith('5-hour')) return '5-hour';
  if (l.startsWith('weekly')) {
    const scope = (label.match(/\(([^)]+)\)/) || [])[1];
    return !scope || scope.toLowerCase() === 'all models' ? 'weekly' : 'weekly ' + scope;
  }
  return label;
}

function resetText(iso) {
  if (!iso) return '';
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return 'resetting now';
  const h = Math.floor(ms / 3.6e6), m = Math.floor(ms % 3.6e6 / 6e4);
  const span = h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : h ? `${h}h ${m}m` : `${m}m`;
  const when = new Date(iso).toLocaleString('en-US', {weekday: 'short', hour: 'numeric', minute: '2-digit'});
  return `resets in ${span} - ${when}`;
}

function meterEl(m, width) {
  const left = Math.round(Math.max(0, Math.min(100, 100 - m.used)));
  const color = level(left);
  const el = document.createElement('div');
  el.className = 'meter';
  const top = document.createElement('div');
  top.className = 'top';
  const pct = document.createElement('div');
  pct.className = 'pct';
  pct.append(pixelText(left + '%', 5, color), pixelText(Math.round(m.used) + '% used', 2, '--muted'));
  top.append(pixelText(shortLabel(m.label), 3, '--ink'), pct);
  const battery = document.createElement('div');
  battery.className = 'battery';
  battery.setAttribute('role', 'img');
  battery.setAttribute('aria-label', `${left}% left`);
  const shell = document.createElement('div');
  shell.className = 'shell';
  const lit = Math.round(left / 10);
  for (let i = 0; i < 10; i++) {
    const b = document.createElement('div');
    b.className = 'block';
    if (i < lit) b.style.background = `var(${color})`;
    shell.append(b);
  }
  const tip = document.createElement('div');
  tip.className = 'tip';
  battery.append(shell, tip);
  el.append(top, battery);
  const reset = resetText(m.resets_at);
  if (reset) {
    const r = fitText(reset, 2, '--muted', width);
    r.classList.add('reset');
    el.append(r);
  }
  return el;
}

function render(services) {
  const root = document.getElementById('services');
  root.replaceChildren();
  for (const s of services) {
    const sec = document.createElement('section');
    root.append(sec);
    const width = sec.clientWidth - 48;
    sec.append(fitText(s.name, 4, '--ink', width));
    if (s.error) sec.append(pixelLines(s.error, 2, '--critical', width));
    if (s.note) sec.append(pixelLines(s.note, 2, '--muted', width));
    for (const m of s.meters || []) sec.append(meterEl(m, width));
  }
}

function setUpdated(textValue, color) {
  document.getElementById('updated').replaceChildren(pixelText(textValue, 2, color));
}

async function load() {
  try {
    const key = new URLSearchParams(location.search).get('key');
    const res = await fetch('/api/usage' + (key ? '?key=' + encodeURIComponent(key) : ''));
    if (res.status === 401) throw new Error('passcode');
    const data = await res.json();
    const banner = document.getElementById('banner');
    banner.style.display = data.demo ? 'block' : 'none';
    if (data.demo && !banner.firstChild) {
      banner.append(pixelLines('Demo mode: made-up numbers. Run battery.py without --demo for real usage.', 2, '--bg', banner.clientWidth - 24));
    }
    render(data.services);
    setUpdated('updated ' + new Date().toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}), '--muted');
  } catch (e) {
    setUpdated(e.message === 'passcode' ? 'passcode missing or wrong' : 'hub not reachable', '--low');
  }
}

document.getElementById('title').append(fitText('Usage Battery', 4, '--ink', document.querySelector('main').clientWidth - 32));
document.title = 'Usage Battery';
load();
setInterval(load, 60000);
</script>
</body>
</html>
